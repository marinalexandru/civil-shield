name: Deploy Server to Google Cloud Run

on:
  push:
    branches:
      - feature/5-backend-authentication-solution-with-oauth-and-passkey-support
#      - main
    paths:
      - 'server/**'
      - 'core/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

env:
  SERVICE_NAME: civilshield-server
  REGION: europe-west1

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Server Fat JAR
        run: ./gradlew :server:shadowJar --no-daemon

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run via Source
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars AUTH0_DOMAIN=civil-shield.eu.auth0.com,AUTH0_AUDIENCE=https://api.civilshield.com
